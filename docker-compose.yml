# Límites fijos de CPU/RAM para que las mediciones antes/después sean comparables.
# Ajustá los límites a tu equipo ANTES de la primera medición y NO los cambiés entre antes y después.
services:
  db:
    image: postgres:16.4
    container_name: reservas-db
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
      POSTGRES_DB: reservas
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=top
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c max_connections=100
    ports: ["127.0.0.1:5432:5432"]          # solo localhost
    volumes: [pgdata:/var/lib/postgresql/data]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 3s
      retries: 20

  api:
    build: .
    container_name: reservas-api
    environment:
      DATABASE_URL: postgres://reservas:reservas@db:5432/reservas
      PG_POOL_MAX: "10"
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-dev}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

volumes:
  pgdata:
